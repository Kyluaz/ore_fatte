<style>
:root{box-sizing:border-box;color-scheme:light dark;
--bg:#f0f4f4;--card:#fff;--tx:#182527;--mu:#647577;--pr:#12827c;--pr2:#1fa393;--pr-rgb:18,130,124;--onpr:#fff;
--hd:#0f6f6b;--hd2:#189a86;--inp:#e7f2f1;--we:#e1ecec;--bd:#dbe6e5;--ok:#1c8a5c;--sun:#e0433f;
--navbg:rgba(255,255,255,.5);--sh:0 1px 2px rgba(20,40,40,.06),0 3px 10px rgba(20,40,40,.06);--trashbg:rgba(224,67,63,.14);
--dayshadow:0 1px 3px rgba(20,40,40,.08),0 4px 14px rgba(20,40,40,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="amoled"]){--bg:#0c1415;--card:#141f21;--tx:#e6f0ef;--mu:#8fa3a3;--pr:#4fc3b6;--pr2:#3aa89b;--pr-rgb:79,195,182;--onpr:#06201d;--inp:#1c2c2c;--we:#28403f;--bd:#233736;--ok:#5fd39a;--sun:#ff6a63;--navbg:rgba(20,31,33,.5);--sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);--trashbg:rgba(255,106,99,.2);--dayshadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 20px rgba(0,0,0,.6)}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1415;--card:#141f21;--tx:#e6f0ef;--mu:#8fa3a3;--pr:#4fc3b6;--pr2:#3aa89b;--pr-rgb:79,195,182;--onpr:#06201d;--inp:#1c2c2c;--we:#28403f;--bd:#233736;--ok:#5fd39a;--sun:#ff6a63;--navbg:rgba(20,31,33,.5);--sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);--trashbg:rgba(255,106,99,.2);--dayshadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 20px rgba(0,0,0,.6)}
:root[data-theme="amoled"]{color-scheme:dark;--bg:#000;--card:#000;--tx:#f0f5f4;--mu:#8a9d9c;--pr:#4fc3b6;--pr2:#3aa89b;--pr-rgb:79,195,182;--onpr:#06201d;--inp:#0d0f0f;--we:#141717;--bd:#1c2221;--ok:#5fd39a;--sun:#ff6a63;--navbg:rgba(30,32,32,.5);--sh:0 0 0 1px rgba(255,255,255,.05);--trashbg:rgba(255,106,99,.22);--dayshadow:0 0 0 1px rgba(255,255,255,.06)}
*,*:before,*:after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--tx);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}

header{flex:none;position:relative;z-index:5;background:var(--navbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
border-bottom:1px solid var(--bd);color:var(--tx);padding-top:env(safe-area-inset-top,0px)}
.monthnav{display:flex;align-items:center;justify-content:center;gap:12px;padding:9px 12px;min-height:52px}
.subrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.spacer{display:flex;align-items:center;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4}
.hb{background:var(--inp);border:0;color:var(--tx);width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;transition:background .15s;box-shadow:0 1px 2px rgba(20,40,40,.1),0 2px 6px rgba(20,40,40,.08)}
.hb svg{width:18px;height:18px}
.hb:active{background:var(--we)}
.hb[disabled]{display:none}
.t{background:none;border:0;color:var(--tx);text-align:center;padding:2px 2px;font-size:clamp(17px,5vw,22px);font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;min-width:0}
.t small{display:block;font-size:11px;font-weight:600;color:var(--mu);margin-top:1px}
.statsrow{display:flex;align-items:center;gap:8px;min-width:0}
.editbtn{transition:opacity .15s;position:fixed;right:14px;z-index:4;background:var(--card);border:1.5px solid var(--pr);color:var(--pr);border-radius:11px;padding:0 13px;height:34px;font-size:12.5px;font-weight:700;white-space:nowrap;display:none;align-items:center;justify-content:center;box-shadow:var(--sh)}
.editbtn.on{background:var(--pr);color:var(--onpr);border-color:var(--pr)}
.stat{display:inline-flex;align-items:baseline;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px 10px;box-shadow:var(--sh)}
.stat span{font-size:9px;opacity:.8;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--mu)}
.stat b{font-size:13.5px;line-height:1;letter-spacing:-.01em;color:var(--tx)}

main{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y}
#track{display:flex;height:100%;width:100%;will-change:transform}
.pane{flex:0 0 100%;width:100%;height:100%;position:relative;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:10px max(10px,calc((100% - 640px)/2)) calc(88px + env(safe-area-inset-bottom,0px))}

.dayrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-width:0}
.day{flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:7px 8px;box-shadow:var(--dayshadow);scroll-margin-top:110px;position:relative}
.day.standalone{margin-bottom:6px}
.day.we{background:var(--we)}
.d2.sun{color:var(--sun);font-weight:700}
.sublabel{font-size:11.5px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:12px 4px 6px}
.sublabel:first-child{margin-top:0}
.sublabel.today{display:inline-block;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2));padding:5px 16px;border-radius:20px;text-transform:none;letter-spacing:0;margin:0 4px 8px}
.viewrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.viewrow span{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--inp);border-radius:10px;padding:7px 4px;font-size:9.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.viewrow span b{font-size:15px;color:var(--tx);font-weight:700;text-transform:none;letter-spacing:0}
.day.compact{padding:5px 7px}
.day.compact .d1{font-size:12.5px}
.day.compact .d2{font-size:10.5px}
.day.compact .h{font-size:11.5px}
.day.compact .dh{margin-bottom:4px}
.day.compact .viewrow span{padding:5px 4px;font-size:8.5px}
.day.compact .viewrow span b{font-size:12.5px}
.day.today{background:linear-gradient(rgba(var(--pr-rgb),.10),rgba(var(--pr-rgb),.10)),var(--card);box-shadow:inset 0 0 0 1.5px var(--pr),var(--dayshadow)}
.chip{display:inline-block;background:var(--pr);color:var(--onpr);font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-left:6px}
.dh{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:0 2px}
.dh>div:first-child{flex:1;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.d1{font-weight:700;font-size:14.5px}.d2{font-size:12px;color:var(--mu)}
.h{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--ok);font-size:13.5px}
.h.empty{display:none}
.hi{display:flex}.hi svg{width:1.05em;height:1.05em}
.tic{display:inline-flex;vertical-align:-2px;margin-right:4px;color:var(--ok)}.tic svg{width:13px;height:13px}
.x{border:0;background:var(--trashbg);color:var(--sun);width:44px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.x:active{filter:brightness(.92)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:6px;min-width:0}
.st>div{min-width:0}
.sr{display:flex;gap:3px;min-width:0}
.lb{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:0 0 3px 2px}
.b{width:34px;height:38px;border:0;border-radius:10px;background:var(--pr);color:var(--onpr);padding:0;display:flex;align-items:center;justify-content:center;transition:filter .1s}
.b svg{width:16px;height:16px}
.b:active{filter:brightness(.82)}
.sr input{flex:1;min-width:0;height:38px;text-align:center;font-size:16.5px;font-weight:600;padding:0 2px;text-overflow:clip;border-radius:10px;border:1px solid var(--bd);background:var(--inp);color:var(--tx)}
.sr input::-webkit-calendar-picker-indicator{display:none}
.x svg{width:16px;height:16px}

.day.big{padding:16px}
.day.big .d1{font-size:16px}.day.big .d2{font-size:13px}.day.big .h{font-size:15px}
.day.big .dh{margin-bottom:12px}
.day.big .st{gap:10px}
.day.big .sr{gap:5px}
.day.big .b{height:50px}
.day.big .sr input{height:50px;font-size:17px;border-radius:12px}
.day.big .x{width:48px;height:38px;border-radius:10px}
.oggidate{font-size:13.5px;color:var(--mu);margin:0 0 10px 2px}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--dayshadow)}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd);font-size:14.5px}
th:first-child,td:first-child{text-align:left}
.tq td{font-weight:700;background:var(--we)}

.pdfrow{display:flex;gap:8px;margin-top:20px}
.pdfrow+.pdfrow{margin-top:8px}
.pdfbtn{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 10px;box-shadow:var(--dayshadow);color:var(--tx);text-align:left;font-size:13px;font-weight:600}
.pdfbtn .ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--inp);color:var(--pr);display:flex;align-items:center;justify-content:center}
.pdfbtn .ic svg{width:18px;height:18px}
.pdfbtn:active{filter:brightness(.96)}

.scard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--dayshadow)}
.row{margin-bottom:16px}.row:last-child{margin-bottom:0}
.row label{display:block;font-size:13px;color:var(--mu);margin-bottom:6px;font-weight:600}
.row input{width:100%;height:46px;font-size:18px;padding:0 12px;border-radius:12px;border:1px solid var(--bd);background:var(--inp);color:var(--tx)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font-size:13.5px;font-weight:600}
.seg button.on{background:var(--pr);color:var(--onpr);border-color:var(--pr)}
.swrow{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:0 1px 2px rgba(20,40,40,.15)}
.sw.on{border-color:var(--tx)}

nav.navbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
display:inline-flex;gap:8px;background:var(--navbg);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);
border:1px solid var(--bd);border-radius:19px;padding:5px 7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px rgba(10,25,25,.12),0 16px 36px rgba(10,25,25,.28)}
.navind{position:absolute;top:5px;bottom:5px;left:0;width:68px;border-radius:14px;background:linear-gradient(135deg,var(--pr),var(--pr2));transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:0}
.navbtn{position:relative;z-index:1;width:68px;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:14px;font-size:9px;transition:color .2s}
.navbtn svg{width:18px;height:18px}
.navbtn .lbl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn.on{color:var(--onpr);font-weight:700}

.ov{position:fixed;inset:0;background:rgba(6,16,17,.55);display:none;align-items:flex-end;z-index:9}
.ov.open{display:flex}
.ov.center{align-items:center;justify-content:center;padding:20px}
.ov.center .sheet{border-radius:20px;max-width:360px}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow:auto}
.calhint{font-size:14px;color:var(--tx);font-weight:700;margin-bottom:10px;text-align:center}
.yearnav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.yearnav .hb{background:var(--inp);color:var(--tx)}
.yt{flex:1;text-align:center;font-size:20px;font-weight:800}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font-size:14.5px;font-weight:600}
.mgrid button.on{background:var(--pr);color:var(--onpr);border-color:var(--pr)}
.mgrid button.cur{box-shadow:inset 0 0 0 2px var(--pr)}
.done{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--onpr);font-size:16px;font-weight:700;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.btnrow{display:flex;gap:10px}
.btnrow .done{margin-top:0}
.done.secondary{background:var(--inp);color:var(--tx)}
</style>
</head>
<body>
<header>
  <div class="monthnav">
    <button class="hb" id="prev" aria-label="Precedente"></button>
    <button class="t" id="title"></button>
    <button class="hb" id="next" aria-label="Successivo"></button>
  </div>
</header>
<button class="editbtn" id="editBtn">Modifica</button>
<main id="main"><div id="track"><section class="pane" id="pane0"></section><section class="pane" id="pane1"></section><section class="pane" id="pane2"></section><section class="pane" id="pane3"></section></div></main>

<nav class="navbar">
  <div class="navind" id="navind"></div>
  <button class="navbtn on" id="t0"><span class="ic"></span><span class="lbl">Oggi</span></button>
  <button class="navbtn" id="t1"><span class="ic"></span><span class="lbl">Mese</span></button>
  <button class="navbtn" id="t2"><span class="ic"></span><span class="lbl">Riepilogo</span></button>
  <button class="navbtn" id="t3"><span class="ic"></span><span class="lbl">Impostazioni</span></button>
</nav>

<div class="ov" id="ovcal"><div class="sheet">
  <div class="calhint" id="calhint"></div>
  <div class="yearnav"><button class="hb" id="ypr" aria-label="Anno precedente"></button><div class="yt" id="ytxt"></div><button class="hb" id="ynx" aria-label="Anno successivo"></button></div>
  <div class="mgrid" id="mgrid"></div>
</div></div>

<div class="ov" id="ovyear"><div class="sheet">
  <div class="calhint" id="calhint2">Scegli l'anno da scaricare</div>
  <div class="yearnav"><button class="hb" id="ypr2" aria-label="Anno precedente"></button><div class="yt" id="ytxt2"></div><button class="hb" id="ynx2" aria-label="Anno successivo"></button></div>
  <button class="done" id="dlyear">Scarica PDF dell'anno</button>
</div></div>

<div id="toast"></div>
<div class="ov center" id="ovshare"><div class="sheet">
  <div class="calhint" id="shareTitle"></div>
  <div id="shareNote" style="font-size:12px;color:var(--mu);margin-bottom:8px;text-align:center"></div>
  <textarea id="shareText" readonly style="width:100%;height:150px;border-radius:12px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font-size:12px;padding:8px;margin-bottom:10px"></textarea>
  <div class="btnrow"><button class="done secondary" id="shareClose">Chiudi</button><button class="done" id="shareCopy">Copia</button></div>
</div></div>
<div class="ov center" id="ovconfirm"><div class="sheet">
  <div class="calhint" id="confirmText">Resettare gli orari di questo giorno?</div>
  <div class="btnrow"><button class="done secondary" id="confirmNo">Annulla</button><button class="done" id="confirmYes" style="background:linear-gradient(135deg,#e0473f,#f0685f)">Svuota</button></div>
</div></div>

<script>
var MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
var MESI3=["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
var GIO=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
var now=new Date(), tab=0, editMode=false, mi=now.getFullYear()*12+now.getMonth(), sy=Math.floor(mi/12), pickYear=sy, pdfYearSel=sy, calMode="nav", yearMode="pdf", pendingDelete=null;
var PALETTES={
  teal:{pr:"#12827c",pr2:"#1fa393",rgb:"18,130,124"},
  blu:{pr:"#1d6fd8",pr2:"#3b8ff0",rgb:"29,111,216"},
  viola:{pr:"#8f7fe6",pr2:"#a999ee",rgb:"143,127,230"},
  verde:{pr:"#1f9d55",pr2:"#3bbf72",rgb:"31,157,85"},
  giallo:{pr:"#c99a1b",pr2:"#dab13c",rgb:"201,154,27"},
  arancione:{pr:"#d9702e",pr2:"#ea8b4a",rgb:"217,112,46"}
};
function applyAccent(){var p=PALETTES[S.accent]||PALETTES.teal,s=document.documentElement.style;
  s.setProperty("--pr",p.pr);s.setProperty("--pr2",p.pr2);s.setProperty("--pr-rgb",p.rgb)}
var S={rate:8,step:15,theme:"system",accent:"teal",def:{i:"06:00",o:"14:00"},d:{}};
try{var r=localStorage.getItem("ore_v1");if(r){var o=JSON.parse(r);for(var q in o)S[q]=o[q]}}catch(e){}
try{var lm=localStorage.getItem("ore_mi");if(lm!==null){mi=+lm;sy=Math.floor(mi/12)}}catch(e){}
function save(){try{localStorage.setItem("ore_v1",JSON.stringify(S));localStorage.setItem("ore_mi",mi)}catch(e){}}
function $(i){return document.getElementById(i)}
function ym(i){return[Math.floor(i/12),i%12]}
function key(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function tm(s){var a=s.split(":");return+a[0]*60+ +a[1]}
function ts(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function hrs(k){var x=S.d[k];if(!x||!x.i||!x.o)return null;return(((tm(x.o)-tm(x.i))+1440)%1440)/60}
function mh(i){var p=ym(i),n=new Date(p[0],p[1]+1,0).getDate(),s=0;for(var d=1;d<=n;d++){var h=hrs(key(p[0],p[1],d));if(h)s+=h}return s}
function f2(n){return n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})}
function eur(n){return f2(n)+" €"}
function statsHTML(t){
  if(t==1){var h=mh(mi);return '<div class="stat"><span class="tic">'+ICO.clock+'</span><span>Ore</span><b>'+f2(h)+'</b></div><div class="stat"><span>Compenso</span><b>'+eur(h*S.rate)+'</b></div>';}
  if(t==0){var k=key(now.getFullYear(),now.getMonth(),now.getDate()),h=hrs(k);return '<div class="stat"><span>Compenso oggi</span><b>'+eur((h||0)*S.rate)+'</b></div>';}
  return '';
}
function updateStats(){for(var t=0;t<2;t++){var el=$("statsrow"+t);if(el)el.innerHTML=statsHTML(t)}}

var ICO={
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="8.3" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.7" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M3 20h18"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.4M12 18.1v2.4M20.5 12h-2.4M5.9 12H3.5M17.7 6.3l-1.7 1.7M8 16l-1.7 1.7M17.7 17.7 16 16M8 8 6.3 6.3"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4.5h12l-2.6 3.5L17 11.5H5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/><path d="M6.5 7v12.5A1.5 1.5 0 0 0 8 21h8a1.5 1.5 0 0 0 1.5-1.5V7"/><path d="M10 11v6M14 11v6"/></svg>',
  chevl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chevr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11.5M7.2 10.7 12 15.5l4.8-4.8"/><path d="M5 19.5h14"/></svg>'
};
function sp(f,lab,v,big){return'<div><span class="lb">'+lab+'</span><div class="sr"><button class="b" data-a="-1" data-f="'+f+'" aria-label="Diminuisci '+lab+'">'+ICO.minus+'</button><input type="time" data-f="'+f+'" value="'+(v||"")+'" aria-label="'+lab+'"><button class="b" data-a="1" data-f="'+f+'" aria-label="Aumenta '+lab+'">'+ICO.plus+'</button></div></div>'}
$("t0").querySelector(".ic").innerHTML=ICO.flag;
$("t1").querySelector(".ic").innerHTML=ICO.cal;
$("t2").querySelector(".ic").innerHTML=ICO.chart;
$("t3").querySelector(".ic").innerHTML=ICO.gear;
$("prev").innerHTML=ICO.chevl;$("next").innerHTML=ICO.chevr;
$("ypr").innerHTML=ICO.chevl;$("ynx").innerHTML=ICO.chevr;
$("ypr2").innerHTML=ICO.chevl;$("ynx2").innerHTML=ICO.chevr;

function settingsHTML(){
  return '<div class="scard">'+
  '<div class="row"><label for="rate">Paga oraria (€)</label><input id="rate" type="number" inputmode="decimal" step="0.5" min="0" value="'+S.rate+'"></div>'+
  '<div class="row"><label for="defi">Orario di entrata predefinito</label><input id="defi" type="time" value="'+S.def.i+'"></div>'+
  '<div class="row"><label for="defo">Orario di uscita predefinito</label><input id="defo" type="time" value="'+S.def.o+'"></div>'+
  '<div class="row"><label>Passo dei pulsanti + / −</label><div class="seg" id="segstep">'+
    [15,30,60].map(function(v){return '<button data-v="'+v+'" class="'+(S.step==v?"on":"")+'">'+(v==60?"1 ora":v+" min")+'</button>'}).join('')+
  '</div></div>'+
  '<div class="row"><label>Colore predominante</label><div class="swrow" id="swrow">'+
    Object.keys(PALETTES).map(function(k){return '<button class="sw'+(S.accent==k?" on":"")+'" data-v="'+k+'" style="background:'+PALETTES[k].pr+'" aria-label="'+k+'"></button>'}).join('')+
  '</div></div>'+
  '<div class="row"><label>Tema</label><div class="seg" id="segtheme">'+
    [["system","Sistema"],["light","Chiaro"],["dark","Scuro"],["amoled","Amoled"]].map(function(v){return '<button data-v="'+v[0]+'" class="'+(S.theme==v[0]?"on":"")+'">'+v[1]+'</button>'}).join('')+
  '</div></div>'+
  '<div class="row"><label>Backup dati</label><div class="seg"><button id="backupExport">Esporta backup</button><button id="backupImport">Importa backup</button></div><input type="file" id="importFile" accept=".json,application/json" style="display:none"></div></div>';
}

function hHTML(h){return '<div class="h'+(h===null?' empty':'')+'"><span class="hi">'+ICO.clock+'</span><span class="hv">'+(h===null?"":f2(h)+" h")+'</span></div>'}
function setH(row,h){var e=row.querySelector(".h");e.classList.toggle("empty",h===null);e.querySelector(".hv").textContent=h===null?"":f2(h)+" h"}
function dayCard(y,m,d,big){
  var w=new Date(y,m,d).getDay(),k=key(y,m,d),x=S.d[k]||{},h=hrs(k),isTod=(y==now.getFullYear()&&m==now.getMonth()&&d==now.getDate());
  var cls="day standalone"+(w==0?" we":"")+(isTod?" today":"")+(big?" big":"");
  return '<div class="'+cls+'" data-k="'+k+'"><div class="dh"><div><span class="d1">'+d+' '+MESI3[m].toLowerCase()+'</span><span class="d2'+(w==0?" sun":"")+'">'+GIO[w]+'</span>'+(isTod&&!big?'<span class="chip">Oggi</span>':'')+'</div>'+hHTML(h)+'<button class="x" data-k="'+k+'" aria-label="Svuota giorno">'+ICO.trash+'</button></div><div class="st">'+sp("i","entrata",x.i)+sp("o","uscita",x.o)+'</div></div>';
}

function dayCardStatic(y,m,d,compact){
  var w=new Date(y,m,d).getDay(),k=key(y,m,d),x=S.d[k]||{},h=hrs(k),isTod=(y==now.getFullYear()&&m==now.getMonth()&&d==now.getDate());
  var cls="day standalone"+(compact?" compact":"")+(w==0?" we":"")+(isTod?" today":"");
  return '<div class="'+cls+'"><div class="dh"><div><span class="d1">'+d+' '+MESI3[m].toLowerCase()+'</span><span class="d2'+(w==0?" sun":"")+'">'+GIO[w]+'</span>'+(isTod?'<span class="chip">Oggi</span>':'')+'</div>'+hHTML(h)+'</div><div class="viewrow"><span>Entrata<b>'+(x.i||"–")+'</b></span><span>Uscita<b>'+(x.o||"–")+'</b></span></div></div>';
}

function moveIndicator(pos,drag){
  if(pos==null)pos=tab;
  var lo=Math.max(0,Math.min(3,Math.floor(pos))),hi=Math.max(0,Math.min(3,Math.ceil(pos))),f=pos-lo;
  var a=$("t"+lo),b=$("t"+hi),ind=$("navind");
  var left=a.offsetLeft+(b.offsetLeft-a.offsetLeft)*f;
  ind.style.transition=drag?"none":"transform .3s cubic-bezier(.4,0,.2,1)";
  ind.style.width=a.offsetWidth+"px";ind.style.transform="translateX("+left+"px)";
}

function positionEditBtn(){var h=document.querySelector("header").offsetHeight;$("editBtn").style.top=(h+10)+"px"}
window.addEventListener("resize",positionEditBtn);

var dirty=[true,true,true,true];
function markDirty(){for(var i=0;i<4;i++)if(i!=tab)dirty[i]=true}
function paneHTML(t){
  var p=ym(mi),o="";
  if(t==0||t==1)o+='<div class="subrow"><div class="statsrow" id="statsrow'+t+'"></div></div>';
  if(t==0){
    var y0=now.getFullYear(),m0=now.getMonth(),d0=now.getDate();
    var yst=new Date(y0,m0,d0-1);
    o+='<div class="sublabel">Ieri</div>'+dayCardStatic(yst.getFullYear(),yst.getMonth(),yst.getDate(),true);
    o+='<div class="sublabel today">Oggi</div>'+dayCard(y0,m0,d0,true);
  }else if(t==1){
    var n=new Date(p[0],p[1]+1,0).getDate();
    for(var d=1;d<=n;d++)o+=editMode?dayCard(p[0],p[1],d,false):dayCardStatic(p[0],p[1],d);
  }else if(t==2){
    o+='<table><tr><th>Mese</th><th>Ore</th><th>Compenso</th></tr>';var th=0;
    for(var i=0;i<12;i++){var h2=mh(sy*12+i);th+=h2;o+='<tr><td>'+MESI[i]+'</td><td>'+f2(h2)+'</td><td>'+eur(h2*S.rate)+'</td></tr>'}
    o+='<tr class="tq"><td>Totale '+sy+'</td><td>'+f2(th)+'</td><td>'+eur(th*S.rate)+'</td></tr></table>';
    o+='<div class="pdfrow"><button class="pdfbtn" id="pdfMonthBtn"><span class="ic">'+ICO.download+'</span>PDF mese</button><button class="pdfbtn" id="pdfYearBtn"><span class="ic">'+ICO.download+'</span>PDF anno</button></div>';
    o+='<div class="pdfrow"><button class="pdfbtn" id="xlsMonthBtn"><span class="ic">'+ICO.download+'</span>Excel mese</button><button class="pdfbtn" id="xlsYearBtn"><span class="ic">'+ICO.download+'</span>Excel anno</button></div>';
  }else{
    o+=settingsHTML();
  }
  return o;
}
function renderPane(i){$("pane"+i).innerHTML=paneHTML(i);dirty[i]=false;updateStats()}
function ensureFresh(i){if(i>=0&&i<4&&dirty[i])renderPane(i)}
function updateChrome(){
  var p=ym(mi);
  $("prev").disabled=(tab!=1&&tab!=2);$("next").disabled=(tab!=1&&tab!=2);
  if(tab==0){$("title").innerHTML="Oggi<small>&nbsp;</small>";}
  else if(tab==1){$("title").innerHTML=MESI[p[1]]+"<small>"+p[0]+"</small>";}
  else if(tab==2){$("title").innerHTML=sy+"<small>Riepilogo annuale</small>";}
  else{$("title").innerHTML="Impostazioni<small>&nbsp;</small>";}
  for(var i=0;i<4;i++)$("t"+i).className="navbtn"+(tab==i?" on":"");
  var eb=$("editBtn");
  eb.style.display=tab==1?"flex":"none";eb.style.opacity=1;eb.style.pointerEvents="auto";
  eb.textContent=editMode?"Fatto":"Modifica";
  eb.className="editbtn"+(editMode?" on":"");
}
var track=$("track");
function setTrack(pos,anim,dx){
  track.style.transition=anim?"transform .34s cubic-bezier(.22,.8,.3,1)":"none";
  track.style.transform="translate3d(calc("+(-pos*100)+"% + "+(dx||0)+"px),0,0)";
}
function scrollCur(){var pn=$("pane"+tab);if(pn)pn.scrollTop=0}
function positionEditBtn(){var h=document.querySelector("header").offsetHeight;$("editBtn").style.top=(h+10)+"px"}
window.addEventListener("resize",positionEditBtn);
function render(){
  updateChrome();
  for(var i=0;i<4;i++)renderPane(i);
  setTrack(tab,false);moveIndicator();positionEditBtn();save();
}
$("editBtn").onclick=function(){editMode=!editMode;renderPane(1);markDirty();updateChrome()};
function commitFocusedField(){
  var af=document.activeElement;
  if(af&&af.tagName=="INPUT"&&af.dataset&&af.dataset.f){var row=af.closest(".day");if(row){setv(row,af.dataset.f,af.value);save()}af.blur()}
}
function goTab(n,instant){
  n=Math.max(0,Math.min(3,n));
  commitFocusedField();
  if(n==tab){setTrack(tab,true);moveIndicator();updateChrome();return}
  if(tab==1&&editMode){editMode=false;dirty[1]=true}
  var from=tab;tab=n;
  if(n==2){sy=Math.floor(mi/12);dirty[2]=true}
  for(var i=Math.min(from,n);i<=Math.max(from,n);i++)ensureFresh(i);
  updateChrome();setTrack(n,!instant);moveIndicator();save();
}
function theme(){var h=document.documentElement;if(S.theme=="light"||S.theme=="dark"||S.theme=="amoled")h.setAttribute("data-theme",S.theme);else h.removeAttribute("data-theme")}

$("prev").onclick=function(){if(tab==1)mi--;else if(tab==2)sy--;else return;renderPane(tab);scrollCur();updateChrome();save()};
$("next").onclick=function(){if(tab==1)mi++;else if(tab==2)sy++;else return;renderPane(tab);scrollCur();updateChrome();save()};
$("t0").onclick=function(){goTab(0,true)};
$("t1").onclick=function(){goTab(1,true)};
$("t2").onclick=function(){goTab(2,true)};
$("t3").onclick=function(){goTab(3,true)};

function renderCal(){
  $("ytxt").textContent=pickYear;
  $("calhint").textContent=(calMode=="pdfmonth"||calMode=="xlsmonth")?"Scegli il mese da scaricare":"Scegli mese e anno";
  var p=ym(mi),g="";
  for(var i=0;i<12;i++){
    var cls=(calMode=="nav"&&pickYear==p[0]&&i==p[1])?"on":(pickYear==now.getFullYear()&&i==now.getMonth()?"cur":"");
    g+='<button class="'+cls+'" data-m="'+i+'">'+MESI3[i]+'</button>';
  }
  $("mgrid").innerHTML=g;
}
$("title").onclick=function(){
  if(tab==1){calMode="nav";pickYear=ym(mi)[0];renderCal();$("ovcal").className="ov open";return}
  if(tab==2){yearMode="goto";pdfYearSel=sy;$("ytxt2").textContent=pdfYearSel;$("calhint2").textContent="Scegli l'anno da visualizzare";$("dlyear").textContent="Vai a questo anno";$("ovyear").className="ov open";return}
};

var toastT;function toast(msg){var t=$("toast");t.textContent=msg;t.className="show";clearTimeout(toastT);toastT=setTimeout(function(){t.className=""},2600)}
function doDelete(k){delete S.d[k];save();var dayEl=$("pane"+tab).querySelector('.day[data-k="'+k+'"]');
  if(dayEl){dayEl.querySelectorAll("input").forEach(function(i){i.value=""});setH(dayEl,null)}markDirty();updateStats()}

async function exportBackup(){
  var data=JSON.stringify({app:"OreFatte",version:1,exported:new Date().toISOString(),data:S},null,1);
  var stamp=new Date().toISOString().slice(0,10);
  offerDownloadBlob(new Blob([data],{type:"application/json"}),"OreFatte_backup_"+stamp+".json",data);
}
function importBackup(input){
  var f=input.files&&input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result),d=obj&&obj.app=="OreFatte"?obj.data:obj;
      if(!d||typeof d!="object"||typeof d.d!="object")throw new Error("formato");
      askConfirm("Importare questo backup? I dati attuali verranno sostituiti.","Importa",function(){
        var ns={rate:8,step:15,theme:"system",accent:"teal",def:{i:"06:00",o:"14:00"},d:{}};
        for(var q in d)ns[q]=d[q];
        S=ns;save();theme();applyAccent();render();toast("Backup importato");
      });
    }catch(err){toast("File di backup non valido")}
    input.value="";
  };
  r.readAsText(f);
}
async function offerDownloadBlob(blob,filename,text){
  var code="";
  try{
    var downloads=await claude.use("downloads");
    if(downloads){await downloads.save({filename:filename,data:blob});return}
    code="non disponibile";
  }catch(e){
    if(e&&e.code=="declined")return;
    code=(e&&(e.code||e.message))||"errore";
  }
  fallbackDownload(blob,filename,text,code);
}
function fallbackDownload(blob,filename,text,code){
  try{var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;a.style.display="none";document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u)},5000)}catch(e){}
  if(text)showShare(filename,text,code);else toast("Download non riuscito ("+code+")");
}
function showShare(filename,text,code){
  $("shareTitle").textContent=filename;
  $("shareNote").textContent="Se il download non è partito ("+code+"), copia il contenuto e incollalo in un file.";
  $("shareText").value=text;
  $("ovshare").className="ov center open";
}
function copyShare(){
  var ta=$("shareText"),t=ta.value;
  function ok(){toast("Copiato negli appunti")}
  function old(){try{ta.focus();ta.select();ta.setSelectionRange(0,t.length);document.execCommand("copy");ok()}catch(e){toast("Copia non riuscita")}}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,old);else old();
}
async function offerDownload(doc,filename){
  offerDownloadBlob(doc.output("blob"),filename);
}
function csvMonth(y,mm){
  var rows=[["Data","Giorno","Entrata","Uscita","Ore"]];
  var n=new Date(y,mm+1,0).getDate(),totH=0;
  for(var d=1;d<=n;d++){
    var dt=new Date(y,mm,d),w=dt.getDay(),k=key(y,mm,d),x=S.d[k]||{},h=hrs(k);
    if(h)totH+=h;
    rows.push([String(d).padStart(2,"0")+"/"+String(mm+1).padStart(2,"0")+"/"+y,GIO[w],x.i||"",x.o||"",h===null?"":f2(h)]);
  }
  rows.push([]);
  rows.push(["Totale ore","","","",f2(totH)]);
  rows.push(["Totale compenso","","","",eur(totH*S.rate)]);
  var csv="\uFEFF"+rows.map(function(r){return r.join(";")}).join("\r\n");
  offerDownloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),"Ore_"+MESI[mm]+"_"+y+".csv",csv);
}
function csvYear(y){
  var rows=[["Mese","Ore","Compenso"]],th=0;
  for(var i=0;i<12;i++){var h2=mh(y*12+i);th+=h2;rows.push([MESI[i],f2(h2),eur(h2*S.rate)])}
  rows.push([]);
  rows.push(["Totale "+y,f2(th),eur(th*S.rate)]);
  var csv="\uFEFF"+rows.map(function(r){return r.join(";")}).join("\r\n");
  offerDownloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),"Riepilogo_"+y+".csv",csv);
}
function pdfMonth(y,mm){
  var jsPDFlib=window.jspdf&&window.jspdf.jsPDF;if(!jsPDFlib){toast("Libreria PDF non disponibile");return}
  var doc=new jsPDFlib();
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(18,97,92);
  doc.text("Registro ore - "+MESI[mm]+" "+y,14,18);
  doc.setFontSize(10);doc.setTextColor(100,110,110);
  doc.text("Paga oraria: "+eur(S.rate),14,25);
  var xs=[14,45,95,125,155],yy=36;
  doc.setDrawColor(210,222,220);doc.setTextColor(25,35,35);doc.setFont("helvetica","bold");
  ["Data","Giorno","Entrata","Uscita","Ore"].forEach(function(h,i){doc.text(h,xs[i],yy)});
  doc.line(14,yy+2,196,yy+2);doc.setFont("helvetica","normal");yy+=9;
  var n=new Date(y,mm+1,0).getDate(),totH=0;
  for(var d=1;d<=n;d++){
    if(yy>280){doc.addPage();yy=20}
    var dt=new Date(y,mm,d),w=dt.getDay(),k=key(y,mm,d),x=S.d[k]||{},h=hrs(k);
    if(h)totH+=h;
    var row=[String(d).padStart(2,"0")+"/"+String(mm+1).padStart(2,"0")+"/"+y,GIO[w],x.i||"-",x.o||"-",h===null?"-":f2(h)];
    row.forEach(function(v,i){doc.text(String(v),xs[i],yy)});
    yy+=7;
  }
  yy+=3;doc.line(14,yy-3,196,yy-3);doc.setFont("helvetica","bold");
  doc.text("Totale ore: "+f2(totH),14,yy+5);
  doc.text("Totale compenso: "+eur(totH*S.rate),100,yy+5);
  offerDownload(doc,"Ore_"+MESI[mm]+"_"+y+".pdf");
}
function pdfYear(y){
  var jsPDFlib=window.jspdf&&window.jspdf.jsPDF;if(!jsPDFlib){toast("Libreria PDF non disponibile");return}
  var doc=new jsPDFlib();
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(18,97,92);
  doc.text("Riepilogo annuale "+y,14,18);
  doc.setFontSize(10);doc.setTextColor(100,110,110);
  doc.text("Paga oraria: "+eur(S.rate),14,25);
  var xs=[14,110,150],yy=36;
  doc.setTextColor(25,35,35);doc.setFont("helvetica","bold");
  ["Mese","Ore","Compenso"].forEach(function(h,i){doc.text(h,xs[i],yy)});
  doc.line(14,yy+2,196,yy+2);doc.setFont("helvetica","normal");yy+=9;
  var th=0;
  for(var i=0;i<12;i++){var h2=mh(y*12+i);th+=h2;
    doc.text(MESI[i],xs[0],yy);doc.text(f2(h2),xs[1],yy);doc.text(eur(h2*S.rate),xs[2],yy);yy+=8}
  doc.line(14,yy-2,196,yy-2);doc.setFont("helvetica","bold");
  doc.text("Totale "+y,xs[0],yy+6);doc.text(f2(th),xs[1],yy+6);doc.text(eur(th*S.rate),xs[2],yy+6);
  offerDownload(doc,"Riepilogo_"+y+".pdf");
}

function setv(row,f,v){var k=row.dataset.k;S.d[k]=S.d[k]||{};S.d[k][f]=v;
  row.querySelector('input[data-f="'+f+'"]').value=v;var h=hrs(k);setH(row,h);markDirty();updateStats()}
function bump(btn){var row=btn.closest(".day"),f=btn.dataset.f,k=row.dataset.k,cur=(S.d[k]||{})[f];
  setv(row,f,cur?ts(tm(cur)+ +btn.dataset.a*S.step):S.def[f])}
var bt1,bt2;function stop(){clearTimeout(bt1);clearInterval(bt2);save()}
var M=$("main");
M.addEventListener("pointerdown",function(e){var b=e.target.closest(".b");if(!b)return;e.preventDefault();bump(b);
  bt1=setTimeout(function(){bt2=setInterval(function(){bump(b)},110)},450)});
["pointerup","pointercancel","pointerleave"].forEach(function(n){M.addEventListener(n,stop)});
M.addEventListener("contextmenu",function(e){if(e.target.closest(".b"))e.preventDefault()});
function handleFieldEvent(e){
  var t=e.target;
  if(t.id=="importFile"){importBackup(t);return}
  if(t.id=="rate"){S.rate=parseFloat(t.value)||0;save();markDirty();updateStats();return}
  if(t.id=="defi"){if(t.value){S.def.i=t.value;save()}return}
  if(t.id=="defo"){if(t.value){S.def.o=t.value;save()}return}
  var row=t.closest(".day");if(!row||!t.dataset.f||t.tagName!="INPUT")return;setv(row,t.dataset.f,t.value);save();
}
M.addEventListener("input",handleFieldEvent);
M.addEventListener("change",handleFieldEvent);
M.addEventListener("blur",handleFieldEvent,true);
M.addEventListener("click",function(e){
  if(e.target.closest("#backupExport")){exportBackup();return}
  if(e.target.closest("#backupImport")){$("importFile").click();return}
  if(e.target.closest("#pdfMonthBtn")){calMode="pdfmonth";pickYear=sy;renderCal();$("ovcal").className="ov open";return}
  if(e.target.closest("#xlsMonthBtn")){calMode="xlsmonth";pickYear=sy;renderCal();$("ovcal").className="ov open";return}
  if(e.target.closest("#xlsYearBtn")){yearMode="xls";pdfYearSel=sy;$("ytxt2").textContent=pdfYearSel;$("calhint2").textContent="Scegli l'anno da scaricare";$("dlyear").textContent="Scarica Excel dell'anno";$("ovyear").className="ov open";return}
  if(e.target.closest("#pdfYearBtn")){yearMode="pdf";pdfYearSel=sy;$("ytxt2").textContent=pdfYearSel;$("calhint2").textContent="Scegli l'anno da scaricare";$("dlyear").textContent="Scarica PDF dell'anno";$("ovyear").className="ov open";return}
  if(e.target.closest(".x")){var dk=e.target.closest(".x").dataset.k;askConfirm("Resettare gli orari di questo giorno?","Svuota",function(){doDelete(dk)});return}
  var seg=e.target.closest("#segstep button");if(seg){S.step=+seg.dataset.v;save();[].forEach.call(seg.parentNode.children,function(b){b.className=b==seg?"on":""});return}
  var segt=e.target.closest("#segtheme button");if(segt){S.theme=segt.dataset.v;save();theme();[].forEach.call(segt.parentNode.children,function(b){b.className=b==segt?"on":""});return}
  var sw=e.target.closest("#swrow button");if(sw){S.accent=sw.dataset.v;save();applyAccent();[].forEach.call(sw.parentNode.children,function(b){b.className=b==sw?"sw on":"sw"});return}
});


function scrollPaneToToday(){
  var p=ym(mi);if(p[0]!=now.getFullYear()||p[1]!=now.getMonth())return;
  var pane=$("pane1"),el=pane.querySelector(".day.today");
  if(el)pane.scrollTop=Math.max(0,el.offsetTop-pane.clientHeight/2+el.offsetHeight/2);
}
theme();applyAccent();render();scrollPaneToToday();

var dr={x:0,y:0,lx:0,lt:0,vx:0,dx:0,dec:0};
function pgW(){return M.clientWidth||window.innerWidth}
function startDrag(){
  commitFocusedField();
  ensureFresh(tab-1);ensureFresh(tab+1);
  var eb=$("editBtn");eb.style.opacity=0;eb.style.pointerEvents="none";
}
M.addEventListener("touchstart",function(e){
  if(e.touches.length!=1||document.querySelector(".ov.open")){dr.dec=-1;return}
  var t=e.touches[0];dr.x=t.clientX;dr.y=t.clientY;dr.lx=t.clientX;dr.lt=e.timeStamp;dr.vx=0;dr.dx=0;dr.dec=0;
},{passive:true});
M.addEventListener("touchmove",function(e){
  if(dr.dec==-1||dr.dec==2)return;
  var t=e.touches[0],dx=t.clientX-dr.x,dy=t.clientY-dr.y;
  if(dr.dec==0){
    if(Math.abs(dy)>10&&Math.abs(dy)>=Math.abs(dx)){dr.dec=2;return}
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){dr.dec=1;startDrag()}else return;
  }
  var dt=e.timeStamp-dr.lt;if(dt>0)dr.vx=0.75*dr.vx+0.25*((t.clientX-dr.lx)/dt);
  dr.lx=t.clientX;dr.lt=e.timeStamp;
  var w=pgW(),d=dx;
  if((tab==0&&d>0)||(tab==3&&d<0))d*=0.3;
  dr.dx=d;setTrack(tab,false,d);moveIndicator(Math.max(0,Math.min(3,tab-d/w)),true);
},{passive:true});
function endDrag(){
  var was=dr.dec;dr.dec=0;
  if(was!=1)return;
  var w=pgW(),d=dr.dx,dir=0;
  if(Math.abs(dr.vx)>0.5)dir=dr.vx<0?1:-1;
  else if(Math.abs(d)>w*0.3)dir=d<0?1:-1;
  goTab(tab+dir);
}
M.addEventListener("touchend",endDrag,{passive:true});
M.addEventListener("touchcancel",endDrag,{passive:true});
</script>
